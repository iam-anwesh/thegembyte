<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — TheGemByte</title>
  <meta name="description" content="Get in touch with TheGemByte — product questions, orders and brand partnerships.">
  <link rel="canonical" href="https://thegembyte.com/contact.html">
  <meta property="og:site_name" content="TheGemByte">
  <meta property="og:title" content="Contact — TheGemByte">
  <meta property="og:description" content="Get in touch with TheGemByte — product questions, orders and brand partnerships.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://thegembyte.com/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0f6b5c">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/products.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main id="main">
    <div class="container">
      <header class="page-head">
        <span class="eyebrow">Say hello</span>
        <h1>Contact us</h1>
        <p>Questions about an order, a product suggestion, or a brand partnership? We reply within two business days. You can also email <a href="mailto:hello@thegembyte.com">hello@thegembyte.com</a>.</p>
      </header>
      <form class="form-grid" data-form="contact" data-success="Thanks — your message is on its way. We'll reply within two business days." style="padding-bottom:64px">
        <label>Name <input class="field" name="name" required autocomplete="name"></label>
        <label>Email <input class="field" type="email" name="email" required autocomplete="email"></label>
        <label>Topic
          <select class="select" name="topic">
            <option>Order or return</option>
            <option>Product question</option>
            <option>Brand partnership / affiliate</option>
            <option>Something else</option>
          </select>
        </label>
        <label>Message <textarea class="field" name="message" rows="6" required></textarea></label>
        <div><button class="btn btn-primary" type="submit">Send message</button></div>
        <p class="form-msg" role="status"></p>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
